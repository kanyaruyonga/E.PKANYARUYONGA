<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EP KANYARUYONGA</title>
<meta name="description" content="Urubuga ruhuza abakozi ba EP KANYARUYONGA (Primary • Nursery)">
<meta name="theme-color" content="#0B4FA8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kanyaruyonga">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#fff;--ink:#0B1F3A;--mu:#566882;--pr:#0B4FA8;--prt:#fff;--acc:#FFC400;--acct:#0B1F3A;--ok:#177A35;--bad:#C0352B;--warn:#A85A07;--bd:#DAE3F0;--soft:#E7EFFB;--soft2:#F5F8FD;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#09131F;--card:#0F1D31;--ink:#E7EEF9;--mu:#9DB0CB;--pr:#6BA8FF;--prt:#06142B;--acc:#FFD23F;--acct:#0B1F3A;--ok:#4ADE80;--bad:#FF8F85;--warn:#FBBF24;--bd:#22344F;--soft:#15294A;--soft2:#112240;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em;line-height:1.2}
h2{font-size:17px;font-weight:700;margin-bottom:10px}
h3{font-size:18px;font-weight:700;margin-bottom:8px}
p{margin:0 0 8px}
a{color:var(--pr)}
small,.mu{font-size:12.5px;color:var(--mu)}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{display:block;width:100%;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:0 0 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
input[type=checkbox]{display:inline-block;width:20px;height:20px;margin:0;padding:0;accent-color:var(--pr);flex:none}
textarea{resize:vertical;min-height:84px}
label.fl{display:block;font-size:12.5px;color:var(--mu);margin:2px 0 4px;font-weight:600}
.pre{white-space:pre-wrap;word-break:break-word}
.ic{width:20px;height:20px;flex:none}
.ic.s{width:16px;height:16px}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
/* shell */
#app{display:none}#app.on{display:block}
.side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,300px);transform:translateX(-104%);transition:transform .22s ease;background:var(--card);border-right:1px solid var(--bd);z-index:40;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(5,15,35,.5);z-index:30;display:none}.scrim.on{display:block}
.sh{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;background:linear-gradient(180deg,var(--soft) 0%,var(--card) 100%);border-bottom:1px solid var(--bd);position:relative;overflow:hidden}
.sh .sun{position:absolute;right:-18px;top:-6px;width:150px;opacity:.5;pointer-events:none}
.sh .who{display:flex;gap:10px;align-items:center;position:relative}
.sh b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:16px}
.sh select{margin:10px 0 0;position:relative}
.sn{padding:8px;flex:1}
.sn button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;cursor:pointer;font-weight:600;color:var(--ink);position:relative}
.sn button:hover{background:var(--soft2)}
.sn button.on{background:var(--soft);color:var(--pr)}
.sn button.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.sf{padding:8px;border-top:1px solid var(--bd)}
.sf button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:11px 12px;border-radius:10px;cursor:pointer;color:var(--bad);font-weight:600}
.col{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h1{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-family:'Public Sans',system-ui,sans-serif;font-weight:500;letter-spacing:0}
.ib{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--ink)}
.ib:hover{background:var(--soft2)}
.bd{position:absolute;top:3px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:var(--acct);font-size:11px;font-weight:800;line-height:18px;text-align:center}
#view{flex:1;width:100%;max-width:800px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--mu);font-size:11px;font-weight:600;position:relative;min-width:0}
.bnav button span.t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav button.on{color:var(--pr)}
.bnav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.bnav .bd{top:2px;right:calc(50% - 24px)}
@media(min-width:960px){.side{transform:none;width:280px}.col{margin-left:280px}.bnav,.menu-b,.scrim{display:none!important}#view{padding-bottom:40px}}
/* gate */
#gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.gh{text-align:center;margin-bottom:14px;position:relative;width:100%;max-width:420px}
.gh .sun{width:230px;display:block;margin:0 auto -30px;opacity:.95}
.gh img.lg{width:132px;height:132px;position:relative}
.gh h1{font-size:25px;font-weight:800;margin-top:6px}
.gc{width:100%;max-width:420px}
.pwrow{display:flex;gap:8px;align-items:center;margin:0 0 10px;font-size:14px;color:var(--ink)}
/* cards */
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card>h2:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row.end{justify-content:flex-end}.row.end>*{flex:0 0 auto}.row.wrap{flex-wrap:wrap}.row.nf>*{flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pr);color:var(--prt);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;text-decoration:none;min-height:42px}
.btn:disabled{opacity:.55;cursor:default}
.btn.g{background:var(--soft);color:var(--ink)}
.btn.d{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13.5px}
.btn.full{width:100%}
.lk{background:none;border:0;padding:4px 6px;cursor:pointer;color:var(--pr);font-weight:600}
.lk.bad{color:var(--bad)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:12px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--mu);position:relative}
.seg button.on{background:var(--card);color:var(--ink)}
.seg .bd{position:static;display:inline-block;margin-left:6px;vertical-align:1px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:11px 12px}
.stat b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:21px;line-height:1.2;word-break:break-word}
.stat span{font-size:12.5px;color:var(--mu)}
.it{padding:10px 0;border-bottom:1px solid var(--bd)}.it:last-child{border-bottom:0;padding-bottom:0}.it:first-child{padding-top:0}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-size:12.5px;font-weight:600}
td input{margin:0;min-width:58px;padding:7px 8px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--ink)}
.tag.w{background:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:14px;padding:3px 4px 3px 11px;margin:2px;font-size:13px}
.chip .lk{padding:0 6px;color:var(--bad)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.empty{padding:18px 8px;text-align:center;color:var(--mu)}
.av{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--pr);font-weight:800;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.l{width:64px;height:64px;font-size:22px}.av.s{width:32px;height:32px;font-size:12px}
.av.h0{background:#DCEBFF;color:#0B4FA8}.av.h1{background:#FFF0B8;color:#6B4B00}.av.h2{background:#D7F2DF;color:#14632B}.av.h3{background:#FFDDD8;color:#8F2A20}.av.h4{background:#E6DDFB;color:#4B2C99}.av.h5{background:#D5F1F4;color:#0E5A66}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:6px}.hd>div{flex:1;min-width:0}.hd b{display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:8px 0}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:var(--soft)}
img.ph{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--soft);cursor:zoom-in}
.file{display:flex;align-items:center;gap:10px;padding:9px 11px;margin:6px 0 0;border:1px solid var(--bd);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--soft2)}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.new{border-left:4px solid var(--acc);padding-left:10px}
.thr{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;padding:4px 2px 8px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;background:var(--soft);align-self:flex-start;word-break:break-word;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--pr);color:var(--prt)}
.bub small{display:block;opacity:.75;color:inherit;margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);display:inline-block;flex:none}
.sun{display:block}
/* overlays */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,15,35,.55)}#modal.on{display:flex}
.dlg{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.dlg p{color:var(--mu)}
#lb{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);padding:12px;cursor:zoom-out}#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#toasts{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;max-width:460px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}
@media(min-width:960px){#toasts{bottom:24px}}
@media (prefers-color-scheme:dark){.toast.ok{color:#06240F}.toast.bad{color:#2A0A07}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.side,.top,.bnav{display:none!important}.col{margin:0}}
[hidden]{display:none!important}

</style>
</head>

<nav id="bnav" class="bnav" aria-label="Ibyingenzi"></nav>
</div>
<div id="modal"></div>
<div id="lb" data-a="lbx" role="dialog" aria-label="Ifoto"></div>
<div id="toasts" aria-live="polite"></div>

function grCtx(){const cl=myCls();if(!cl.length)return null;const c=cl.includes(G.gc)?G.gc:cl[0],mine=mySub(c),ct=!boss()&&M().ct==c,ss=(boss()||ct)?SUB:mine,s=ss.includes(G.gs)?G.gs:(mine[0]||ss[0]);if(!s)return null;
 const assigned=boss()||mine.includes(s),uk=unlKey(c,s),unl=!!D.unlock?.[uk]?.on,L=stIn(c);return{c,s,uk,assigned,unl,L,canE:x=>assigned&&(boss()||unl||!grOf(x.id,s))}}

ACT.saveGr=async()=>{const x=grCtx();if(!x)return;const L=x.L.filter(x.canE);if(!L.length)return toast('Nta manota yo kubika.','bad');const si=SUB.indexOf(x.s),t=TERM();
 const mk=(st)=>({sid:st.id,cls:x.c,sub:x.s,si:String(si),term:t,v:[0,1,2,3,4].map(i=>{const raw=G.mk?.[x.uk+':'+st.id+':'+i],cur=grOf(st.id,x.s)?.[i],val=raw!==undefined?raw:(cur??'');return Math.min(20,Math.max(0,Math.round((+val||0)*10)/10))}),ts:Date.now()});
 if(await run(()=>Promise.all(L.map(st=>FB.set('gr',t+'_'+st.id+'_'+si,mk(st)))),'Amanota yabitswe')){
  if(!boss()&&x.unl)await run(()=>FB.set('unlock',x.uk,{on:false},true));
  Object.keys(G.mk||{}).filter(k=>k.startsWith(x.uk+':')).forEach(k=>delete G.mk[k]);log('Yanditse amanota '+x.c+' '+x.s+' '+tl(t));render(true)}};

const app=initializeApp(cfg),auth=getAuth(app),fs=getFirestore(app),stg=getStorage(app);

 },
 async get(c,id){const s=await getDoc(dref(c,id));return s.exists()?s.data():null},
 set:(c,id,d,merge)=>setDoc(dref(c,id),d,merge?{merge:true}:{}),

 del:(c,id)=>deleteDoc(dref(c,id)),

 watch(c,flt,on,err){let first=true;const q=flt?query(col(c),where(flt[0],'==',flt[1])):col(c);
  return onSnapshot(q,s=>{const docs=s.docs.map(d=>[d.id,d.data()]),added=first?[]:s.docChanges().filter(x=>x.type=='added').map(x=>['added',x.doc.id,x.doc.data()]);first=false;on({docs,added})},e=>err&&err(e))},
 watchDoc:(c,id,on,err)=>onSnapshot(dref(c,id),s=>on(s.exists()?s.data():null),e=>err&&err(e)),
 async batch(ops){const b=writeBatch(fs);ops.forEach(o=>{const r=dref(o.c,o.id);if(o.t=='set')b.set(r,o.d,o.merge?{merge:true}:{});else if(o.t=='upd')b.update(r,o.d);else b.delete(r)});await b.commit()},
 upload(path,file,prog){return new Promise((ok,no)=>{const r=ref(stg,path),t=uploadBytesResumable(r,file,{contentType:file.type||'application/octet-stream'});t.on('state_changed',s=>{if(prog)prog(s.totalBytes?s.bytesTransferred/s.totalBytes*100:0)},no,async()=>{try{ok(await getDownloadURL(r))}catch(e){no(e)}})})},
 rmFile:p=>deleteObject(ref(stg,p))
};
